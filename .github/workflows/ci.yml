name: CI

on:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v --json-report --json-report-file=raw-results.json

      - name: Build and send report
        if: always()
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: python scripts/build_report.py

      # ---- Enhanced Email Report with Attachment ----
      - name: Send Email Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: Esha Zia <eshahhh2024@gmail.com>
          subject: "[PASSED] EshaZia045/Assignment-Submission-Portal @ ${{ github.sha }} - Test Report"
          body: |
            Test report for EshaZia045/Assignment-Submission-Portal

            Overall result : PASSED
            Branch : ${{ github.ref_name }}
            Commit : ${{ github.sha }}
            Pipeline run : ${{ github.run_id }}
            Run URL : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The full JSON test report is attached.
          attachments: test-report.json

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4